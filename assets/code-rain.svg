<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.48" stop-color="#0d1022"/>
      <stop offset="1" stop-color="#050711"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="12" y="12" width="876" height="236" rx="16"/>
    </clipPath>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="12" y="12" width="876" height="236" rx="16" stroke="url(#edge)" stroke-width="2" opacity="0.95"/>
  <path d="M32 42H868M32 218H868" stroke="url(#edge)" stroke-width="1.5" opacity="0.7"/>

  <g clip-path="url(#frame)">
    <g opacity="0.55">
      <path d="M60 0V260M120 0V260M180 0V260M240 0V260M300 0V260M360 0V260M420 0V260M480 0V260M540 0V260M600 0V260M660 0V260M720 0V260M780 0V260M840 0V260" stroke="#13213c"/>
      <path d="M0 65H900M0 130H900M0 195H900" stroke="#13213c"/>
    </g>

    <g font-family="Consolas, Monaco, 'Courier New', monospace" font-size="16" filter="url(#glow)">
      <g fill="#00e5ff" opacity="0.92">
        <animateTransform attributeName="transform" type="translate" values="0 -260;0 260" dur="7s" repeatCount="indefinite"/>
        <text x="54" y="16">SELECT *</text><text x="54" y="48">WHERE lift&gt;0</text><text x="54" y="80">p &lt; 0.05</text><text x="54" y="112">E = mc^2</text><text x="54" y="144">df['ret']</text><text x="54" y="176">F = m*a</text><text x="54" y="208">beta_1</text><text x="54" y="240">GROUP BY</text><text x="54" y="272">cohort()</text><text x="54" y="304">A/B test</text><text x="54" y="336">sigma^2</text><text x="54" y="368">y_hat</text><text x="54" y="400">JOIN</text><text x="54" y="432">p = m*v</text><text x="54" y="464">np.mean()</text><text x="54" y="496">z-score</text>
      </g>

      <g fill="#ff2e63" opacity="0.86">
        <animateTransform attributeName="transform" type="translate" values="0 -120;0 400" dur="9s" begin="-2s" repeatCount="indefinite"/>
        <text x="188" y="0">d/dx</text><text x="188" y="34">root_cause</text><text x="188" y="68">PV = nRT</text><text x="188" y="102">log_loss</text><text x="188" y="136">ARR</text><text x="188" y="170">curl data</text><text x="188" y="204">theta</text><text x="188" y="238">gravity=9.8</text><text x="188" y="272">SQL</text><text x="188" y="306">chi_sq</text><text x="188" y="340">Bayes</text><text x="188" y="374">LTV/CAC</text><text x="188" y="408">K-means</text><text x="188" y="442">funnel()</text><text x="188" y="476">vector</text>
      </g>

      <g fill="#c9d1d9" opacity="0.72">
        <animateTransform attributeName="transform" type="translate" values="0 -340;0 220" dur="8s" begin="-4s" repeatCount="indefinite"/>
        <text x="342" y="20">for row in df:</text><text x="342" y="54">retention</text><text x="342" y="88">a^2+b^2=c^2</text><text x="342" y="122">confidence</text><text x="342" y="156">P(A|B)</text><text x="342" y="190">WHERE event</text><text x="342" y="224">metric_sleuth</text><text x="342" y="258">velocity</text><text x="342" y="292">sample_size</text><text x="342" y="326">import pandas</text><text x="342" y="360">null_hyp</text><text x="342" y="394">momentum</text><text x="342" y="428">dashboard</text><text x="342" y="462">causal()</text><text x="342" y="496">forecast</text>
      </g>

      <g fill="#7c3aed" opacity="0.9">
        <animateTransform attributeName="transform" type="translate" values="0 -220;0 300" dur="6.5s" begin="-1s" repeatCount="indefinite"/>
        <text x="546" y="12">grad = 0</text><text x="546" y="46">SELECT user_id</text><text x="546" y="80">force()</text><text x="546" y="114">R^2</text><text x="546" y="148">activation</text><text x="546" y="182">lambda</text><text x="546" y="216">run_model()</text><text x="546" y="250">entropy</text><text x="546" y="284">N = 10k</text><text x="546" y="318">cohort_id</text><text x="546" y="352">F = -kx</text><text x="546" y="386">pipeline</text><text x="546" y="420">uplift</text><text x="546" y="454">matrix</text>
      </g>

      <g fill="#00e5ff" opacity="0.76">
        <animateTransform attributeName="transform" type="translate" values="0 -80;0 440" dur="10s" begin="-5s" repeatCount="indefinite"/>
        <text x="710" y="8">if anomaly:</text><text x="710" y="42">alert()</text><text x="710" y="76">p-value</text><text x="710" y="110">orbit</text><text x="710" y="144">JOIN users</text><text x="710" y="178">CLV</text><text x="710" y="212">regression</text><text x="710" y="246">signal</text><text x="710" y="280">variance</text><text x="710" y="314">friction</text><text x="710" y="348">power</text><text x="710" y="382">model.fit</text><text x="710" y="416">delta</text><text x="710" y="450">noise</text>
      </g>
    </g>

    <rect x="12" y="12" width="876" height="236" rx="16" fill="url(#bg)" opacity="0.12"/>
    <line x1="28" y1="72" x2="872" y2="72" stroke="#00e5ff" stroke-width="2" opacity="0.22">
      <animate attributeName="y1" values="30;230;30" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="30;230;30" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.38;0.08" dur="4.8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
