<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.16" stop-color="white" stop-opacity="1"/>
      <stop offset="0.84" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="verticalFade">
      <rect width="900" height="260" fill="url(#fade)"/>
    </mask>
  </defs>

  <g mask="url(#verticalFade)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="17" font-weight="500" filter="url(#softGlow)">
    <g fill="#00e5ff" opacity="0.92">
      <animateTransform attributeName="transform" type="translate" values="0 -330;0 300" dur="7s" repeatCount="indefinite"/>
      <text x="36" y="8">SELECT *</text><text x="36" y="44">p &lt; 0.05</text><text x="36" y="80">E = mc^2</text><text x="36" y="116">df['ret']</text><text x="36" y="152">F = m*a</text><text x="36" y="188">beta_1</text><text x="36" y="224">GROUP BY</text><text x="36" y="260">cohort()</text><text x="36" y="296">A/B test</text><text x="36" y="332">sigma^2</text><text x="36" y="368">y_hat</text><text x="36" y="404">JOIN</text><text x="36" y="440">p = m*v</text><text x="36" y="476">np.mean()</text><text x="36" y="512">z-score</text>
    </g>

    <g fill="#ff2e63" opacity="0.84">
      <animateTransform attributeName="transform" type="translate" values="0 -260;0 370" dur="8.5s" begin="-1.8s" repeatCount="indefinite"/>
      <text x="176" y="0">d/dx</text><text x="176" y="34">root_cause</text><text x="176" y="68">PV = nRT</text><text x="176" y="102">log_loss</text><text x="176" y="136">ARR</text><text x="176" y="170">curl data</text><text x="176" y="204">theta</text><text x="176" y="238">gravity=9.8</text><text x="176" y="272">SQL</text><text x="176" y="306">chi_sq</text><text x="176" y="340">Bayes</text><text x="176" y="374">LTV/CAC</text><text x="176" y="408">K-means</text><text x="176" y="442">funnel()</text><text x="176" y="476">vector</text>
    </g>

    <g fill="#c9d1d9" opacity="0.78">
      <animateTransform attributeName="transform" type="translate" values="0 -390;0 240" dur="7.8s" begin="-3.6s" repeatCount="indefinite"/>
      <text x="340" y="20">for row in df:</text><text x="340" y="56">retention</text><text x="340" y="92">a^2+b^2=c^2</text><text x="340" y="128">confidence</text><text x="340" y="164">P(A|B)</text><text x="340" y="200">WHERE event</text><text x="340" y="236">metric_sleuth</text><text x="340" y="272">velocity</text><text x="340" y="308">sample_size</text><text x="340" y="344">import pandas</text><text x="340" y="380">null_hyp</text><text x="340" y="416">momentum</text><text x="340" y="452">dashboard</text><text x="340" y="488">causal()</text><text x="340" y="524">forecast</text>
    </g>

    <g fill="#7c3aed" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0 -300;0 330" dur="6.8s" begin="-0.9s" repeatCount="indefinite"/>
      <text x="548" y="12">grad = 0</text><text x="548" y="48">SELECT user_id</text><text x="548" y="84">force()</text><text x="548" y="120">R^2</text><text x="548" y="156">activation</text><text x="548" y="192">lambda</text><text x="548" y="228">run_model()</text><text x="548" y="264">entropy</text><text x="548" y="300">N = 10k</text><text x="548" y="336">cohort_id</text><text x="548" y="372">F = -kx</text><text x="548" y="408">pipeline</text><text x="548" y="444">uplift</text><text x="548" y="480">matrix</text>
    </g>

    <g fill="#00e5ff" opacity="0.72">
      <animateTransform attributeName="transform" type="translate" values="0 -210;0 420" dur="9.4s" begin="-4.8s" repeatCount="indefinite"/>
      <text x="732" y="8">if anomaly:</text><text x="732" y="44">alert()</text><text x="732" y="80">p-value</text><text x="732" y="116">orbit</text><text x="732" y="152">JOIN users</text><text x="732" y="188">CLV</text><text x="732" y="224">regression</text><text x="732" y="260">signal</text><text x="732" y="296">variance</text><text x="732" y="332">friction</text><text x="732" y="368">power</text><text x="732" y="404">model.fit</text><text x="732" y="440">delta</text><text x="732" y="476">noise</text>
    </g>
  </g>
</svg>
